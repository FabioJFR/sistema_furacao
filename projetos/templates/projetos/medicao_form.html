{% extends 'projetos/base.html' %}
{% load i18n %}

{% block content %}
<section class="sf-page">

    <div class="sf-panel border-t-4 border-blue-600">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            {{ titulo }}
        </h1>

        {% if form.non_field_errors %}
            <div class="mb-4 rounded-lg bg-red-100 text-red-700 p-3">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <form method="post" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <div class="space-y-4">
                {{ form.as_p }}
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" 
                        class="flex-1 flex items-center justify-center bg-emerald-600 text-white py-2 rounded-lg font-semibold hover:bg-emerald-700 transition shadow">
                    💾 {% trans "Salvar" %}
                </button>

                {% if furo %}
                    <a href="{{ furo.get_absolute_url }}" 
                       class="flex-1 flex items-center justify-center bg-gray-500 text-white py-2 rounded-lg font-semibold hover:bg-gray-600 transition shadow">
                        🔙 {% trans "Voltar" %}
                    </a>
                {% else %}
                    <a href="{% url 'projetos:medicao_list' %}" 
                       class="flex-1 flex items-center justify-center bg-gray-500 text-white py-2 rounded-lg font-semibold hover:bg-gray-600 transition shadow">
                        🔙 {% trans "Voltar" %}
                    </a>
                {% endif %}
            </div>
        </form>
    </div>

</section>
{% endblock %}
