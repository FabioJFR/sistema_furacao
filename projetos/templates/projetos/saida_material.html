{% extends "projetos/base.html" %}
{% load i18n %}

{% block title %}{% trans "Saída de Material" %}{% endblock %}

{% block content %}
<section class="max-w-xl mx-auto p-6">

    <div class="bg-white rounded-xl shadow-lg p-6">

        <h1 class="text-2xl font-bold mb-4 text-gray-800">📤 {% trans "Saída de Material" %}</h1>

        <p class="mb-6 text-gray-600">
            {% trans "Material:" %} <span class="font-semibold text-gray-900">{{ material.nome }}</span>
        </p>

        <form method="post" class="space-y-4">
            {% csrf_token %}

            <div>
                {{ form.as_p }}
            </div>

            <div class="flex gap-3 mt-4">
                <a href="{% url 'projetos:materiais_list' %}"
                   class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition font-semibold text-center w-full">
                    🔙 {% trans "Voltar" %}
                </a>

                <button type="submit"
                        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition font-semibold w-full">
                    ✔️ {% trans "Registar saída" %}
                </button>
            </div>
        </form>

    </div>

</section>
{% endblock %}
