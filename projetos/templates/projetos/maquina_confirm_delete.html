{% extends 'projetos/base.html' %}
{% load static %}

{% block title %}Apagar Máquina{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/projeto/maquina_confirm_delete.css' %}">
{% endblock %}

{% block content %}
<div class="mcd-wrap">

    <h2 class="mcd-title">⚠️ Apagar Máquina</h2>

    <p class="mcd-text">
        Tem a certeza que deseja apagar a máquina:
    </p>

    <h3 class="mcd-name">{{ maquina.nome }}</h3>

    <form method="POST">
        {% csrf_token %}

        <div class="mcd-actions">
            <button type="submit" class="mcd-btn mcd-btn-delete">
                🗑️ Sim, apagar
            </button>

            <a href="{% url 'projetos:maquina_detail' maquina.id %}" class="mcd-btn mcd-btn-cancel">
                🔙 Cancelar
            </a>
        </div>
    </form>

</div>
{% endblock %}
