{% extends "projetos/base.html" %}

{% block content %}
<div id="cesiumContainer" style="width: 100%; height: 85vh; border-radius:12px;"></div>

{{ projetos|json_script:"projetos-data" }}
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/cesium@1.111/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.111/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<script>
    // ⚠️ Ideal: vir do backend (settings)
    Cesium.Ion.defaultAccessToken = "{{ CESIUM_TOKEN|default:'' }}";

    const viewer = new Cesium.Viewer('cesiumContainer', {
        terrainProvider: Cesium.createWorldTerrain(),
        timeline: false,
        animation: false,
        baseLayerPicker: true,
        geocoder: false,
        homeButton: true,
        sceneModePicker: true,
        navigationHelpButton: false
    });

    const projetos = JSON.parse(document.getElementById('projetos-data').textContent);

    // 🎯 Função para validar coordenadas
    function coordenadasValidas(lat, lon) {
        return lat !== null && lon !== null &&
               !isNaN(lat) && !isNaN(lon);
    }

    // 🎯 Ícone personalizado
    const pinBuilder = new Cesium.PinBuilder();

    projetos.forEach(p => {

        if (!coordenadasValidas(p.localizacao_lat, p.localizacao_lon)) return;

        const pin = pinBuilder
            .fromColor(Cesium.Color.BLUE, 48)
            .toDataURL();

        viewer.entities.add({
            name: p.nome,

            position: Cesium.Cartesian3.fromDegrees(
                p.localizacao_lon,
                p.localizacao_lat,
                p.altitude || 0
            ),

            billboard: {
                image: pin,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM
            },

            label: {
                text: p.nome,
                font: '14px sans-serif',
                fillColor: Cesium.Color.WHITE,
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 2,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                verticalOrigin: Cesium.VerticalOrigin.TOP,
                pixelOffset: new Cesium.Cartesian2(0, -40)
            },

            description: `
                <div style="padding:10px; max-width:260px;">
                    <h3 style="margin:0 0 5px 0;">📁 ${p.nome}</h3>
                    <p style="margin:0;">📍 ${p.cidade || '-'} ${p.pais || ''}</p>
                    <p style="margin:5px 0;">📊 Estado: ${p.status || '-'}</p>
                    <a href="/app/projetos/${p.id}/"
                       style="display:inline-block; margin-top:8px; color:#2563eb;">
                       🔍 Ver Projeto
                    </a>
                </div>
            `
        });
    });

    // 🔍 Zoom automático inteligente
    if (projetos.length > 0) {
        viewer.zoomTo(viewer.entities);
    }

    // 🖱️ Clique com foco + zoom
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    handler.setInputAction(function(click) {
        const picked = viewer.scene.pick(click.position);

        if (Cesium.defined(picked) && picked.id) {
            viewer.selectedEntity = picked.id;

            viewer.flyTo(picked.id, {
                duration: 1.5,
                offset: new Cesium.HeadingPitchRange(0, -0.5, 500)
            });
        }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

</script>
{% endblock %}
