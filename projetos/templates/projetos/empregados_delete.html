{% extends "projetos/base.html" %}
{% load static %}

{% block title %}Excluir Empregado{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/projeto/empregados_delete.css' %}">
{% endblock %}

{% block content %}
<section class="container mx-auto p-6">
    <div class="ed-wrap">
        <h2 class="ed-title">Excluir Empregado</h2>
        <p>Tem certeza que deseja excluir o empregado <strong>{{ empregado.nome }}</strong>?</p>

        <form method="POST" class="ed-form">
            {% csrf_token %}
            <button type="submit" class="ed-btn ed-btn-delete">
                🗑️ Excluir
            </button>

            <a href="{% url 'projetos:empregados_list' %}" class="ed-btn ed-btn-cancel">
                🔙 Cancelar
            </a>
        </form>
    </div>
</section>
{% endblock %}
