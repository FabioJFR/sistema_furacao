{% extends "projetos/base.html" %}

{% block title %}Sem Permissão{% endblock %}

{% block content %}
<section class="max-w-2xl mx-auto p-6">
    <div class="bg-white rounded-xl shadow-lg p-6 text-center space-y-4">
        <h1 class="text-2xl font-bold text-red-600">⛔ Sem permissão</h1>
        <p class="text-gray-600">Não tens permissão para aceder a esta página.</p>
        <div class="flex justify-center gap-3">
            <button onclick="history.back()"
                    class="bg-gray-500 text-white px-5 py-2 rounded-lg hover:bg-gray-600 transition shadow font-semibold">
                🔙 Voltar
            </button>
            <a href="{% url 'projetos:redirect_after_login' %}"
               class="bg-blue-600 text-white px-5 py-2 rounded-lg hover:bg-blue-700 transition shadow font-semibold inline-flex items-center justify-center">
                🏠 Ir para o painel
            </a>
        </div>
    </div>
</section>
{% endblock %}
