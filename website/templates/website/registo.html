<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registo</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fb; color: #111827; }
        .container { max-width: 760px; margin: 0 auto; padding: 32px 24px; }
        .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .row { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; }
        input, select { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; }
        .btn { padding: 12px 18px; border-radius: 10px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .actions { display: flex; gap: 10px; margin-top: 8px; }
        .btn-secondary { background: #e5e7eb; color: #111827; text-align: center; }
        .helper { margin-top: -8px; margin-bottom: 16px; color: #6b7280; font-size: 14px; }
        .top-link { display: inline-block; margin-bottom: 18px; color: #6b7280; text-decoration: none; font-weight: 600; }
        .top-link:hover { color: #111827; }
        .messages { margin-bottom: 18px; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 10px; }
        .error { background: #fee2e2; color: #991b1b; }
        .success { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{% url 'website:home' %}" class="top-link">← Voltar à Home</a>
        <h1>Criar conta</h1>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        <div class="card">
            <form method="post">
                {% csrf_token %}

                <div class="row">
                    <label>Tipo de conta</label>
                    <select name="tipo_conta" id="id_tipo_conta">
                        <option value="empresa" {% if dados.tipo_conta == 'empresa' %}selected{% endif %}>Empresa</option>
                        <option value="individual" {% if dados.tipo_conta == 'individual' %}selected{% endif %}>Individual</option>
                    </select>
                </div>

                <div class="row">
                    <label>Username</label>
                    <input type="text" name="username" value="{{ dados.username|default:'' }}">
                </div>

                <div class="row">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ dados.email|default:'' }}">
                </div>

                <div class="row">
                    <label>Nome do responsável</label>
                    <input type="text" name="nome_responsavel" value="{{ dados.nome_responsavel|default:'' }}">
                </div>

                <div class="row" id="empresa_row">
                    <label>Nome da empresa</label>
                    <input type="text" name="nome_empresa" id="id_nome_empresa" value="{{ dados.nome_empresa|default:'' }}">
                </div>

                <div class="row">
                    <label>Plano</label>
                    <select name="plano">
                        {% for plano in planos %}
                            <option value="{{ plano.id }}" {% if dados.plano == plano.id|stringformat:"s" %}selected{% endif %}>
                                {{ plano.nome }} - {{ plano.preco_mensal }} €/mês
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <p class="helper">
                    O tipo de conta deve corresponder ao plano selecionado.
                </p>

                <div class="row">
                    <label>Password</label>
                    <input type="password" name="password1">
                </div>

                <div class="row">
                    <label>Confirmar password</label>
                    <input type="password" name="password2">
                </div>

                <div class="actions">
                    <a href="{% url 'website:home' %}" class="btn btn-secondary">Voltar</a>
                    <button type="submit" class="btn btn-primary">Criar conta</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        (function () {
            const tipoContaSelect = document.getElementById('id_tipo_conta');
            const empresaRow = document.getElementById('empresa_row');
            const nomeEmpresaInput = document.getElementById('id_nome_empresa');

            function atualizarFormulario() {
                if (!tipoContaSelect || !empresaRow || !nomeEmpresaInput) return;

                const isEmpresa = tipoContaSelect.value === 'empresa';
                empresaRow.style.display = isEmpresa ? 'block' : 'none';
                nomeEmpresaInput.required = isEmpresa;

                if (!isEmpresa) {
                    nomeEmpresaInput.value = '';
                }
            }

            tipoContaSelect.addEventListener('change', atualizarFormulario);
            atualizarFormulario();
        })();
    </script>
</body>
</html>
