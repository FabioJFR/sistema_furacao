{% extends "projetos/base.html" %}
{% block title %}Email Enviado{% endblock %}

{% block content %}
<section class="container mx-auto p-6">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-6 text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">
            📩 Email enviado
        </h2>

        <p class="text-gray-600 mb-6">
            Se existir uma conta com esse email, foi enviado um link para redefinir a password.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary">
            Voltar ao login
        </a>
    </div>
</section>
{% endblock %}
